name: Run Tests

on: 
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: '0 3 * * *' # nightly job at 3 am UTC

env:
  SOFA_ROOT: ${{ github.workspace }}/sofa-install

jobs:
  build:
    name: Build on ${{ matrix.os }} with SOFA branch ${{ matrix.sofa_branch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        sofa_branch: [master]

    steps:    
      - name: Checkout source code
        uses: actions/checkout@v2
        with:
          path: ${{ env.WORKSPACE_SRC_PATH }}

      - name: Download SOFA 
        id: sofa-download
        shell: bash
        run: |
          mkdir -p "${{ runner.temp }}/sofa_tmp/zip" "${{ runner.temp }}/sofa_tmp/binaries" "$SOFA_ROOT"
          urlPrefix="https://github.com/SofaComplianceRobotics/SofaRobotics.CI/releases/download/release-main/"
          urlSuffix="SOFA-Robotics-main-unstable_Linux.zip"
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            urlSuffix="SOFA-Robotics-main-unstable_MacOS.zip"
          elif [[ "$RUNNER_OS" == "Windows" ]]; then
            urlSuffix="SOFA-Robotics-main-unstable_Win64.zip"
          fi
          url="$urlPrefix/$urlSuffix"
          echo "Getting SOFA from $url"
          curl --http1.0 --output "${{ runner.temp }}/sofa_tmp/${{ runner.os }}.zip" -L $url
          unzip -qq "${{ runner.temp }}"/sofa_tmp/${{ runner.os }}.zip -d "${{ runner.temp }}/sofa_tmp/zip"
          unzip -qq "${{ runner.temp }}"/sofa_tmp/zip/${{ runner.os }}/SOFA*.zip -d "${{ runner.temp }}/sofa_tmp/binaries"
          $SUDO mv "${{ runner.temp }}"/sofa_tmp/binaries/SOFA*/* "$SOFA_ROOT"

      - name: Additional Install 
        shell: bash
        run: |
            if [[ "$RUNNER_OS" == "Linux" ]]; then
                sudo apt install libopengl0 
            elif [[ "$RUNNER_OS" == "macOS" ]]; then
                brew install glew
                brew install glfw
                brew install tinyxml2
            fi
            
      - name: Install python dependencies
        shell: bash
        run: |
            $SOFA_ROOT/bin/python/bin/python -m pip install --only-binary :all: -r requirements.txt
            $SOFA_ROOT/bin/python/bin/python -m pip install pytest

      - name: Set env vars
        shell: bash
        env:
          SOFTROBOTS_ROOT: $SOFA_ROOT/plugins/SoftRobots
          SOFTROBOTSINVERSE_ROOT: $SOFA_ROOT/plugins/SoftRobots.Inverse
          SOFAGLFW_ROOT: $SOFA_ROOT/plugins/SofaGLFW
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            export WIN_SOFA_ROOT=$( echo "/$SOFA_ROOT" | sed -e 's/\\/\//g' -e 's/://' )
            WIN_WORKSPACE=$( echo "/$GITHUB_WORKSPACE" | sed -e 's/\\/\//g' -e 's/://' )
            echo "$(cd $WIN_SOFA_ROOT/bin && pwd -W)" >> $GITHUB_PATH
            echo "PYTHONPATH=$WIN_SOFA_ROOT/plugins/SofaPython3/lib/python3/site-packages:$WIN_WORKSPACE:$PYTHONPATH" | tee -a $GITHUB_ENV
            echo "LD_LIBRARY_PATH=$WIN_SOFA_ROOT/lib:$LD_LIBRARY_PATH" | tee -a $GITHUB_ENV
          else
            echo "PATH=$PATH:$SOFA_ROOT/bin" | tee -a $GITHUB_ENV
            echo "PYTHONPATH=$SOFA_ROOT/lib/python3/site-packages:$SOFA_ROOT/plugins/SofaPython3/lib/python3/site-packages:$GITHUB_WORKSPACE:$PYTHONPATH" | tee -a $GITHUB_ENV
            if [[ "$RUNNER_OS" == "macOS" ]]; then
              echo "DYLD_FALLBACK_LIBRARY_PATH=$SOFA_ROOT/lib:$DYLD_FALLBACK_LIBRARY_PATH" | tee -a $GITHUB_ENV
            else
              echo "LD_LIBRARY_PATH=$SOFA_ROOT/lib:$LD_LIBRARY_PATH" | tee -a $GITHUB_ENV
            fi
          fi

      - name: Run tests
        shell: bash
        run: |
          cd  ${GITHUB_WORKSPACE}
          $SOFA_ROOT/bin/python/bin/python -m pytest tests/

          

